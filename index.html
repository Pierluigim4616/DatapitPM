<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Telemetría Temperatura - DataPitPM</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #00FFAA;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      justify-content: center;
      max-width: 600px;
      margin: 30px auto;
    }

    .wheel {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      border-radius: 10px;
      background-color: #111;
    }

    .rect {
      width: 120px;    /* Ancho mayor para rectángulo acostado */
      height: 80px;    /* Alto menor */
      border-radius: 8px;
      margin-bottom: 10px;
      transition: background-color 0.5s;
    }

    .label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .temp {
      font-size: 20px;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

  <h1>📟 Telemetría Temperatura - DataPitPM</h1>

  <div class="grid">
    <div class="wheel">
      <div class="label">DI (Del. Izq.)</div>
      <div id="rect-di" class="rect"></div>
      <div id="temp-di" class="temp">-- °C</div>
    </div>
    <div class="wheel">
      <div class="label">DD (Del. Der.)</div>
      <div id="rect-dd" class="rect"></div>
      <div id="temp-dd" class="temp">-- °C</div>
    </div>
    <div class="wheel">
      <div class="label">TI (Tras. Izq.)</div>
      <div id="rect-ti" class="rect"></div>
      <div id="temp-ti" class="temp">-- °C</div>
    </div>
    <div class="wheel">
      <div class="label">TD (Tras. Der.)</div>
      <div id="rect-td" class="rect"></div>
      <div id="temp-td" class="temp">-- °C</div>
    </div>
  </div>

  <div class="footer">Actualizando cada 5 segundos desde ThingSpeak...</div>

  <script>
    const channelID = '2964528';
    const readAPIKey = '9HSRGKSIHYRQ5P32';

    function getColor(temp) {
      if (temp < 40) return '#00f';   // azul
      if (temp < 60) return '#0ff';   // celeste
      if (temp < 80) return '#0f0';   // verde
      if (temp < 95) return '#ff0';   // amarillo
      return '#f00';                  // rojo
    }

    function updateUI(data) {
      const temps = [
        { id: 'di', value: parseFloat(data.field1) },
        { id: 'dd', value: parseFloat(data.field2) },
        { id: 'ti', value: parseFloat(data.field3) },
        { id: 'td', value: parseFloat(data.field4) }
      ];

      temps.forEach(t => {
        const tempText = document.getElementById(`temp-${t.id}`);
        const rect = document.getElementById(`rect-${t.id}`);
        if (!isNaN(t.value)) {
          tempText.textContent = `${t.value.toFixed(1)} °C`;
          rect.style.backgroundColor = getColor(t.value);
        } else {
          tempText.textContent = '-- °C';
          rect.style.backgroundColor = '#444';
        }
      });
    }

    async function fetchData() {
      try {
        const res = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds/last.json?api_key=${readAPIKey}`);
        const data = await res.json();
        updateUI(data);
      } catch (e) {
        console.error('Error al obtener datos:', e);
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>

</body>
</html>
